spring:
  application:
    name: auth-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/granttrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: AuthHikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  # The shared schema is migrated by core-service (single Flyway owner). Other
  # services only validate their subset of the schema.
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

granttrack:
  storage:
    upload-dir: ${GRANTTRACK_UPLOAD_DIR:./uploads}
  bootstrap:
    admin-email: ${GRANTTRACK_BOOTSTRAP_ADMIN_EMAIL:admin@granttrack.local}
    admin-password: ${GRANTTRACK_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${GRANTTRACK_JWT_SECRET:}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
      issuer: granttrack
    cors:
      allowed-origins: ${GRANTTRACK_CORS_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.granttrack: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
