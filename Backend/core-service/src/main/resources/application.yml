spring:
  application:
    name: core-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/granttrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: GrantTrackHikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /
  error:
    include-message: always
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

granttrack:
  storage:
    upload-dir: ${GRANTTRACK_UPLOAD_DIR:./uploads}
  # Shared token authenticating service-to-service /internal calls (must match notification-service).
  internal:
    token: ${GRANTTRACK_INTERNAL_TOKEN:}
  bootstrap:
    # First-run admin credentials. In non-local profiles the password MUST be supplied
    # (GRANTTRACK_BOOTSTRAP_ADMIN_PASSWORD); startup fails fast otherwise. See application-local.yml.
    admin-email: ${GRANTTRACK_BOOTSTRAP_ADMIN_EMAIL:admin@granttrack.local}
    admin-password: ${GRANTTRACK_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      # No default: non-local profiles MUST provide a unique Base64 256-bit key. The local
      # development key lives only in application-local.yml.
      secret: ${GRANTTRACK_JWT_SECRET:}
      access-token-expiration-ms: 900000        # 15 minutes
      refresh-token-expiration-ms: 604800000     # 7 days
      issuer: granttrack
    cors:
      # Explicit allowlist (comma-separated). Credentials are enabled, so wildcards are not allowed.
      allowed-origins: ${GRANTTRACK_CORS_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.granttrack: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
