spring:
  application:
    name: notification-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/granttrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: NotificationHikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  # Schema migrated by core-service (single Flyway owner); this service only validates.
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
    include-stacktrace: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

granttrack:
  # Shared HMAC secret (must match every other service) for validating access tokens.
  security:
    jwt:
      secret: ${GRANTTRACK_JWT_SECRET:}
      issuer: granttrack
  # Shared token authenticating service-to-service /internal calls (must match core-service).
  internal:
    token: ${GRANTTRACK_INTERNAL_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.granttrack: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
