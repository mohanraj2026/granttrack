<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GrantTrack — Research Grant &amp; Academic Output Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GrantTrack — manage the full research-grant lifecycle: funding calls, applications, blind peer review, awards, disbursement, progress and research outputs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Boot splash — visible until Angular renders, then replaced by the app */
    #gt-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
      background: radial-gradient(130% 120% at 15% 10%, #0e2f52 0%, #0a2540 46%, #071b30 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #gt-splash .gt-logo {
      width: 64px; height: 64px; color: #6ee7b7;
      animation: gt-pulse 1.4s ease-in-out infinite;
    }
    #gt-splash .gt-name { color: #fff; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; opacity: 0; animation: gt-fade-up .6s ease .1s forwards; }
    #gt-splash .gt-bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    #gt-splash .gt-bar > i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #059669, #6ee7b7); animation: gt-slide 1.1s ease-in-out infinite; }
    @keyframes gt-pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes gt-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    @keyframes gt-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes gt-splash-out { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>
  <gt-root>
    <div id="gt-splash">
      <svg class="gt-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.41 2.41 0 0 0 0-3.41L13.7 2.71a2.41 2.41 0 0 0-3.41 0Z"/>
      </svg>
      <div class="gt-name">GrantTrack</div>
      <div class="gt-bar"><i></i></div>
    </div>
  </gt-root>
</body>
</html>
