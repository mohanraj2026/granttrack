<gt-outputs-tabs />

<gt-page-header title="Research Outputs" subtitle="Track publications and research outputs across awards.">
  <button *gtHasRole="[Role.RESEARCHER]" class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="openCreate()"><gt-icon name="plus" [size]="16" /> New output</button>
</gt-page-header>

<div class="card border-0 shadow-sm rounded-4 mb-4">
  <div class="card-header bg-white border-0 pt-3 pb-0 px-4">
    <gt-search-filter-bar
      searchPlaceholder="Search by title…"
      [filters]="typeFilter"
      (change)="onFilter($event)">
      <div style="width:250px">
        <gt-searchable-select
          [ngModel]="null"
          (ngModelChange)="onFilter({ awardId: $event ? $event.toString() : '' })"
          [options]="awardOptions()"
          placeholder="All Awards"
          searchPlaceholder="Search awards…">
        </gt-searchable-select>
      </div>
    </gt-search-filter-bar>
  </div>

  <div class="card-body p-0">
    <gt-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [sortField]="(query().sort || '').split(',')[0]"
    [sortDir]="$any((query().sort || '').split(',')[1] || 'asc')"
    (sortChange)="onSort($event)"
    [rowActions]="actions"
    emptyTitle="No research outputs"
    emptySubtitle="Record your first output to start tracking publications.">
      <ng-template #actions let-row>
        <gt-dropdown-menu>
          <button *gtHasRole="[Role.RESEARCHER]" class="dropdown-item py-2" (click)="openEdit(row)">
            <gt-icon name="edit" [size]="16" class="me-2 text-primary" /> Edit
          </button>
          <button *gtHasRole="[Role.RESEARCHER, Role.ADMIN]" class="dropdown-item py-2 text-danger" (click)="remove(row)">
            <gt-icon name="trash-2" [size]="16" class="me-2" /> Delete
          </button>
        </gt-dropdown-menu>
      </ng-template>
    </gt-data-table>
  </div>

  <div class="card-footer bg-white border-top px-4 py-3">
    <gt-paginator
      [page]="query().page || 0"
      [size]="query().size || 20"
      [totalElements]="total()"
      [totalPages]="totalPages()"
      (pageChange)="onPage($event)"
      (sizeChange)="onSize($event)" />
  </div>
</div>

<gt-modal [open]="modalOpen()" [title]="modalTitle()" [width]="680" (closed)="modalOpen.set(false)">
  <form [formGroup]="form" id="outputForm" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Award <span class="text-danger">*</span></label>
        <gt-searchable-select
          formControlName="awardId"
          id="awardId"
          [options]="awardOptions()"
          placeholder="Select award…"
          searchPlaceholder="Search by Award #…"
          [invalid]="invalid('awardId')">
        </gt-searchable-select>
        @if (invalid('awardId')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Award is required.</div> }
      </div>
      <div class="col-md-6">
        <label class="form-label" for="type">Type <span class="text-danger">*</span></label>
        <div class="input-group gt-input" [class.is-invalid]="invalid('type')">
          <span class="input-group-text"><gt-icon name="book" [size]="16" /></span>
          <select class="form-select" formControlName="type" id="type" [class.is-invalid]="invalid('type')">
            <option value="JOURNAL_ARTICLE">Journal Article</option>
            <option value="CONFERENCE_PAPER">Conference Paper</option>
            <option value="PATENT">Patent</option>
            <option value="DATASET">Dataset</option>
            <option value="SOFTWARE">Software</option>
            <option value="POLICY_BRIEF">Policy Brief</option>
          </select>
        </div>
        @if (invalid('type')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Type is required.</div> }
      </div>

      <div class="col-12">
        <label class="form-label" for="title">Title <span class="text-danger">*</span></label>
        <div class="input-group gt-input" [class.is-invalid]="invalid('title')">
          <span class="input-group-text"><gt-icon name="file-text" [size]="16" /></span>
          <input class="form-control py-2" formControlName="title" id="title" [class.is-invalid]="invalid('title')" placeholder="Publication or output title" />
        </div>
        @if (invalid('title')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Title is required.</div> }
      </div>

      <div class="col-12">
        <label class="form-label" for="authors">Authors</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="users" [size]="16" /></span>
          <input class="form-control py-2" formControlName="authors" id="authors" placeholder="Comma-separated author list" />
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="publicationVenue">Publication venue</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="landmark" [size]="16" /></span>
          <input class="form-control py-2" formControlName="publicationVenue" id="publicationVenue" placeholder="Journal / conference" />
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="doi">DOI</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="external-link" [size]="16" /></span>
          <input class="form-control py-2" formControlName="doi" id="doi" placeholder="10.xxxx/xxxxx" />
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="publishedDate">Published date</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="calendar" [size]="16" /></span>
          <input type="date" class="form-control py-2" formControlName="publishedDate" id="publishedDate" />
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="status">Status</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="check-circle" [size]="16" /></span>
          <select class="form-select" formControlName="status" id="status">
            <option value="PUBLISHED">Published</option>
            <option value="SUBMITTED">Submitted</option>
            <option value="IN_PREPARATION">In Preparation</option>
          </select>
        </div>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" formControlName="openAccessCompliant" id="openAccessCompliant" />
          <label class="form-check-label" for="openAccessCompliant">Open access compliant</label>
        </div>
      </div>
    </div>
  </form>

  <div footer class="d-flex justify-content-end gap-2">
    <button class="btn btn-light" (click)="modalOpen.set(false)">Cancel</button>
    <button class="btn btn-primary px-4 d-inline-flex align-items-center gap-2" form="outputForm" type="submit" [disabled]="saving()">
      @if (saving()) { <span class="spinner-border spinner-border-sm"></span> Saving… } @else { <gt-icon name="check" [size]="16" /> Save output }
    </button>
  </div>
</gt-modal>
