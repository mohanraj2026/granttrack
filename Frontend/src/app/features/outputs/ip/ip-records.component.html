<gt-outputs-tabs />

<gt-page-header title="IP Records" subtitle="Manage intellectual property arising from awards.">
  <button *gtHasRole="[Role.RESEARCHER]" class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="openCreate()"><gt-icon name="plus" [size]="16" /> New IP record</button>
</gt-page-header>

<div class="card border-0 shadow-sm rounded-4 mb-4">
  <div class="card-header bg-white border-0 pt-3 pb-0 px-4">
    <gt-search-filter-bar
      [showSearch]="false"
      [filters]="statusFilter"
      (change)="onFilter($event)">
      <div style="width:250px">
        <gt-searchable-select
          [ngModel]="null"
          (ngModelChange)="onFilter({ awardId: $event ? $event.toString() : '' })"
          [options]="awardOptions()"
          placeholder="All Awards"
          searchPlaceholder="Search awards…">
        </gt-searchable-select>
      </div>
    </gt-search-filter-bar>
  </div>

  <div class="card-body p-0">
    <gt-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [sortField]="(query().sort || '').split(',')[0]"
    [sortDir]="$any((query().sort || '').split(',')[1] || 'asc')"
    (sortChange)="onSort($event)"
    [rowActions]="actions"
    emptyTitle="No IP records"
    emptySubtitle="Record your first patent or IP asset to start tracking.">
      <ng-template #actions let-row>
        <gt-dropdown-menu>
          <button *gtHasRole="[Role.RESEARCHER]" class="dropdown-item py-2" (click)="openEdit(row)">
            <gt-icon name="edit" [size]="16" class="me-2 text-primary" /> Edit
          </button>
          <button *gtHasRole="[Role.RESEARCHER, Role.ADMIN]" class="dropdown-item py-2 text-danger" (click)="remove(row)">
            <gt-icon name="trash-2" [size]="16" class="me-2" /> Delete
          </button>
        </gt-dropdown-menu>
      </ng-template>
    </gt-data-table>
  </div>

  <div class="card-footer bg-white border-top px-4 py-3">
    <gt-paginator
      [page]="query().page || 0"
      [size]="query().size || 20"
      [totalElements]="total()"
      [totalPages]="totalPages()"
      (pageChange)="onPage($event)"
      (sizeChange)="onSize($event)" />
  </div>
</div>

<gt-modal [open]="modalOpen()" [title]="modalTitle()" [width]="680" (closed)="modalOpen.set(false)">
  <form [formGroup]="form" id="ipForm" (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Award <span class="text-danger">*</span></label>
        <gt-searchable-select
          formControlName="awardId"
          id="awardId"
          [options]="awardOptions()"
          placeholder="Select award…"
          searchPlaceholder="Search by Award #…"
          [invalid]="invalid('awardId')">
        </gt-searchable-select>
        @if (invalid('awardId')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Award is required.</div> }
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ipType">IP type <span class="text-danger">*</span></label>
        <div class="input-group gt-input" [class.is-invalid]="invalid('ipType')">
          <span class="input-group-text"><gt-icon name="award" [size]="16" /></span>
          <select class="form-select" formControlName="ipType" id="ipType" [class.is-invalid]="invalid('ipType')">
            <option value="PATENT">Patent</option>
            <option value="COPYRIGHT">Copyright</option>
            <option value="TRADEMARK">Trademark</option>
            <option value="TRADE_SECRET">Trade Secret</option>
          </select>
        </div>
        @if (invalid('ipType')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> IP type is required.</div> }
      </div>

      <div class="col-12">
        <label class="form-label" for="title">Title <span class="text-danger">*</span></label>
        <div class="input-group gt-input" [class.is-invalid]="invalid('title')">
          <span class="input-group-text"><gt-icon name="file-text" [size]="16" /></span>
          <input class="form-control py-2" formControlName="title" id="title" [class.is-invalid]="invalid('title')" placeholder="Title of the IP asset" />
        </div>
        @if (invalid('title')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Title is required.</div> }
      </div>

      <div class="col-12">
        <label class="form-label" for="inventors">Inventors</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="users" [size]="16" /></span>
          <input class="form-control py-2" formControlName="inventors" id="inventors" placeholder="Comma-separated inventor list" />
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="filingDate">Filing date</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="calendar" [size]="16" /></span>
          <input type="date" class="form-control py-2" formControlName="filingDate" id="filingDate" />
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="grantDate">Grant date</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="calendar" [size]="16" /></span>
          <input type="date" class="form-control py-2" formControlName="grantDate" id="grantDate" />
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="ownershipPercent">Ownership %</label>
        <div class="input-group gt-input" [class.is-invalid]="invalid('ownershipPercent')">
          <span class="input-group-text"><gt-icon name="scale" [size]="16" /></span>
          <input type="number" min="0" max="100" class="form-control py-2" formControlName="ownershipPercent" id="ownershipPercent" [class.is-invalid]="invalid('ownershipPercent')" placeholder="0–100" />
        </div>
        @if (invalid('ownershipPercent')) { <div class="d-flex align-items-center gap-1 text-danger small mt-1"><gt-icon name="alert-triangle" [size]="13" /> Ownership must be between 0 and 100.</div> }
      </div>
      <div class="col-md-6">
        <label class="form-label" for="status">Status</label>
        <div class="input-group gt-input">
          <span class="input-group-text"><gt-icon name="check-circle" [size]="16" /></span>
          <select class="form-select" formControlName="status" id="status">
            <option value="FILED">Filed</option>
            <option value="GRANTED">Granted</option>
            <option value="ABANDONED">Abandoned</option>
          </select>
        </div>
      </div>
    </div>
  </form>

  <div footer class="d-flex justify-content-end gap-2">
    <button class="btn btn-light" (click)="modalOpen.set(false)">Cancel</button>
    <button class="btn btn-primary px-4 d-inline-flex align-items-center gap-2" form="ipForm" type="submit" [disabled]="saving()">
      @if (saving()) { <span class="spinner-border spinner-border-sm"></span> Saving… } @else { <gt-icon name="check" [size]="16" /> Save IP record }
    </button>
  </div>
</gt-modal>
